
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوت‌نامه اختصاصی دانیال</title>
<style>
body {
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#191329,#49254d,#9b5968);
  font-family:Tahoma,sans-serif;
  color:white;
}
.card {
  width:82%;
  max-width:380px;
  padding:35px 22px;
  text-align:center;
  border:1px solid #e6c58b;
  border-radius:22px;
  background:#ffffff18;
  box-shadow:0 0 30px #0005;
}
h1 {color:#f5d69d;}
p {line-height:2.2;}
input {
  width:85%;
  padding:12px;
  margin:8px;
  border:0;
  border-radius:9px;
  font-family:Tahoma;
}
button {
  background:#e6c58b;
  color:#38213b;
  border:0;
  padding:13px 25px;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="card">
<h1>یک دعوت ویژه ❤️</h1>
<p>شهرام عزیز</p>
<p>از طرف دانیال، به یک قرار دوستانه و خاص در یک رستوران دعوت هستی.</p>
<p>منتظر حضورت هستم.</p>

<form action="https://formsubmit.co/nouraiealireza8@gmail.com" method="POST">
<input type="hidden" name="_subject" value="پاسخ دعوت‌نامه شهرام">
<input type="hidden" name="_template" value="table">

<input type="text" name="نام" placeholder="نام شما" required>

<input type="hidden" name="پاسخ" value="دعوت را قبول می‌کنم ❤️">

<button type="submit">قبول دعوت ❤️</button>
</form>

</div>
</body>
</html>
